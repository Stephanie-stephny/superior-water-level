name: Download Superior Water Level Data

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: "0 6 * * *"

  # Also allows you to run it manually
  workflow_dispatch:


permissions:
  contents: write


jobs:

  download-data:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install requests pandas


      - name: Download water level data
        run: |
          python download_water_level.py


      - name: Commit updated CSV
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add Superior_Water_Level_All.csv

          if git diff --cached --quiet; then
            echo "No new data to commit."
          else

            git commit \
              -m "Update Superior water level data"

            git push

          fi
